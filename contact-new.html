<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tally Form Embed</title>
    <script async src="https://tally.so/widgets/embed.js"></script>
    <style>
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            background: #f0f2f5; 
            font-family: Arial, sans-serif;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            height: 100vh;
        }
        
        iframe {
            width: 100%;
            height: calc(100vh - 40px);
            border: none;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <iframe 
            data-tally-src="https://tally.so/r/wkKL5r?transparentBackground=1"
            title="Contact Form">
        </iframe>
    </div>
</body>
</html>
